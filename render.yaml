databases:
  - name: rozel-postgres
    databaseName: rozel
    user: rozel
    plan: basic-256mb

services:
  - type: web
    name: rozel-api
    env: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm --filter @rozel/api build
    startCommand: pnpm --filter @rozel/api start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rozel-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rozel-postgres
          property: connectionString

  - type: web
    name: rozel-web
    env: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm --filter @rozel/web build
    startCommand: pnpm --filter @rozel/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://rozelshop.com
      - key: API_URL
        value: https://api.rozelshop.com/api

  - type: web
    name: rozel-admin
    env: node
    plan: starter
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm --filter @rozel/admin build
    startCommand: pnpm --filter @rozel/admin start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_URL
        value: https://vault.rozelshop.com
      - key: API_URL
        value: https://api.rozelshop.com/api
